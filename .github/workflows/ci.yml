name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Central-only settings present
        run: |
          test -f .mvn/settings.xml
          test -f .mvn/maven.config
          # Ban list in enforcer may mention private names; only fail on real Maven coordinates
          if grep -nE '<groupId>com\.quinsic(\.|<)|<artifactId>app-core</artifactId>' pom.xml; then
            echo 'Private dependency coordinate found in pom.xml' >&2
            exit 1
          fi
          echo 'OK: settings + no private dependency coordinates'
      - name: Test (JDK 21 + Boot 4.1 + Central only)
        run: mvn -B clean test
      - name: Package
        run: mvn -B -DskipTests package
      - name: Dependency tree has no private artifacts
        run: |
          mvn -B -q dependency:tree -DoutputFile=target/deps.txt
          if grep -E 'com\.quinsic|app-core' target/deps.txt; then
            echo 'Private dependency found' >&2
            exit 1
          fi
          echo 'OK: no private deps'
      - name: Enforcer (JDK + banned private deps)
        # Rules live on execution id enforce-java-and-oss (also runs in default lifecycle)
        run: mvn -B enforcer:enforce@enforce-java-and-oss
