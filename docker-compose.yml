# AAAX local mesh
# Infra only (IntelliJ / host jar):  docker compose up -d
# Infra + jar:                       docker compose --profile stack up --build
# Stop:                              docker compose --profile stack down

services:
  postgres:
    image: postgres:16-alpine
    container_name: aaax-postgres
    environment:
      POSTGRES_DB: aaax
      POSTGRES_USER: aaax
      POSTGRES_PASSWORD: aaax
    ports:
      - "5432:5432"
    volumes:
      - aaax_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaax -d aaax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aaax-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aaax:
    profiles: ["stack"]
    build: .
    container_name: aaax
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      AS_ISSUER: http://localhost:8081
      DB_URL: jdbc:postgresql://postgres:5432/aaax
      DB_USERNAME: aaax
      DB_PASSWORD: aaax
      JPA_DDL_AUTO: update
      LIQUIBASE_ENABLED: "true"
      REDIS_URL: redis
      REDIS_PORT: "6379"
      REDIS_SSL: "false"
      AAAX_LOCAL_SEED: "true"
      AAAX_KAFKA_ENABLED: "false"
      AAAX_UTIL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  aaax_pg:
