services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aaax
      POSTGRES_USER: aaax
      POSTGRES_PASSWORD: aaax
    ports:
      - "5432:5432"
    volumes:
      - aaax_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaax -d aaax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aaax:
    build: .
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      AAAX_ISSUER: http://localhost:8081
      AAAX_JWK_PATH: /data/aaax-jwk.json
      DB_URL: jdbc:postgresql://postgres:5432/aaax
      DB_USERNAME: aaax
      DB_PASSWORD: aaax
      DB_DRIVER: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - aaax_jwk:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  aaax_pg:
  aaax_jwk:
