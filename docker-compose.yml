# AAAX local mesh — Postgres + Redis only
# Usage: docker compose up -d
# Stop:  docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: aaax-postgres
    environment:
      POSTGRES_DB: aaax
      POSTGRES_USER: aaax
      POSTGRES_PASSWORD: aaax
    ports:
      - "5432:5432"
    volumes:
      - aaax_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaax -d aaax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aaax-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aaax_pg:
