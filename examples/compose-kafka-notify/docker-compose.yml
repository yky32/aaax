services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aaax
      POSTGRES_USER: aaax
      POSTGRES_PASSWORD: aaax
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaax -d aaax"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  aaax:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      AAAX_ISSUER: http://localhost:8081
      AAAX_JWK_PATH: /data/aaax-jwk.json
      DB_URL: jdbc:postgresql://postgres:5432/aaax
      DB_USERNAME: aaax
      DB_PASSWORD: aaax
      DB_DRIVER: org.postgresql.Driver
      AAAX_EVENTS_KAFKA_ENABLED: "true"
      AAAX_EVENTS_KAFKA_BOOTSTRAP: kafka:9092
      AAAX_EVENTS_KAFKA_TOPIC: aaax.identity.events
      AAAX_OTP_CHANNEL: kafka
      AAAX_OTP_KAFKA_BOOTSTRAP: kafka:9092
      AAAX_DEMO_SEED_CLIENT: "true"
      AAAX_DEMO_SEED_ACCOUNT: "true"
    volumes:
      - aaax_jwk:/data
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  sample-notify:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./consumer.py:/app/consumer.py:ro
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      AAAX_EVENTS_TOPIC: aaax.identity.events
    command: >
      bash -c "pip install -q kafka-python && python -u consumer.py"
    depends_on:
      kafka:
        condition: service_healthy
      aaax:
        condition: service_started

volumes:
  aaax_jwk:
