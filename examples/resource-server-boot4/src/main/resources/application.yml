server:
  port: ${PORT:8082}

spring:
  application:
    name: aaax-resource-server-example
  security:
    oauth2:
      resourceserver:
        jwt:
          # AAAX issuer (must match aaax.issuer)
          issuer-uri: ${AAAX_ISSUER:http://localhost:8081}
          # alternative if issuer metadata unreachable:
          # jwk-set-uri: ${AAAX_JWKS:http://localhost:8081/oauth2/jwks}

management:
  endpoints:
    web:
      exposure:
        include: health
