<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAAX callback</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    pre { background: #111; color: #d7ffd7; padding: 1rem; overflow: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Completing sign-in…</h1>
  <pre id="out">exchanging code…</pre>
  <p><a href="./">← back</a></p>
  <script src="./aaax.js"></script>
  <script>
    const out = (x) => { document.getElementById("out").textContent = typeof x === "string" ? x : JSON.stringify(x, null, 2); };
    const aaax = Aaax.create({
      issuer: localStorage.getItem("aaax_issuer") || "http://localhost:8081",
      clientId: "aaax-spa",
      redirectUri: location.origin + "/callback.html",
    });
    aaax.handleRedirectCallback()
      .then((t) => {
        out({ ok: true, token_type: t.token_type, expires_in: t.expires_in, has_refresh: !!t.refresh_token });
        setTimeout(() => location.replace("./"), 800);
      })
      .catch((e) => out(String(e.message || e)));
  </script>
</body>
</html>
