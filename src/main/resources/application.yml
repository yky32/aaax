pod:
  ip: ${POD_IP:10.0.0.1}

server:
  port: ${SERVER_PORT:8081}
  max-http-header-size: 10MB
  servlet:
    context-path: ${CONTEXT_PATH:/}

otp:
  fail-counter: 3

config:
  credentials-history-size: ${CONFIG_CREDENTIALS_HISTORY_SIZE:0}
  user-created-waiting-time-ms: ${USER_CREATED_WAITING_TIME_MS:1}
  system-invoker: ${SYSTEM_INVOKER:TGT}
  device-binding:
    mode: ${CONFIG_DEVICE_BINDING_MODE:TRUST_LATEST}
  microservice:
    timezone: ${MICROSERVICE_TIME_ZONE:Asia/Tokyo} # UTC

spring:
  application:
    name: ${APPLICATION_NAME:AAAX}
  servlet:
    multipart:
      # UAA only needs small payloads (avatars/config). 5GB defaults caused heap pressure / OOM.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aaax}
    username: ${DB_USERNAME:aaax}
    password: ${DB_PASSWORD:}
    hikari:
      # Keep pool modest under small pod memory limits.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} #be-careful: create=always re-create, update=upsert, none=no action
    show-sql: ${JPA_SHOW_SQL:false}
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}
  security:
    issuer: ${AS_ISSUER:http://localhost:8080}
    registered-client:
      secret: ${REGISTERED_CLIENT_SECRET:secret}
    refresh-token:
      history-count: ${REFRESH_TOKEN_HISTORY_COUNT:10}
    server:
      expiry-time: ${SERVER_TOKEN_EXPIRY_TIME:31556926} # seconds 31556926
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/oauth2/jwks}
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
  # kafka config
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      # Bound poll batch size to reduce peak heap when lag builds up.
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      properties:
        allow.auto.create.topics: true # important
        # Fail fast if broker is unreachable instead of long hangs during GC/OOM thrash.
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:45000}
    consumers:
      user-with-user-route-creation-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_ROUTE_CREATION:true}
      log-listener:
        isEnabled: ${KAFKA_CONSUMERS_LOG:true}
      user-alias-generated-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_ALIAS_GENERATED:true}
      user-created-notification-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_CREATED_NOTIFICATION:true}
      user-permission-mutation-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_PERMISSION_MUTATION:true}
      user-state-change-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_STATE_CHANGE:true}
      user-status-change-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_STATUS_CHANGE:true}
  # redis配置
  data:
    redis:
      host: ${REDIS_URL:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000
      ssl:
        enabled: ${REDIS_SSL:false}
#  # LOCAL Redis
