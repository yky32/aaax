# AAAX — secrets belong in env, not here.
# Three roots: spring (Boot native) · aaax (this app) · ext (outbound)

# =============================================================================
# spring — Spring Boot native
# =============================================================================
server:
  port: ${SERVER_PORT:8081}
  max-http-request-header-size: 10MB
  servlet:
    context-path: ${CONTEXT_PATH:/}

spring:
  application:
    name: ${APPLICATION_NAME:AAAX}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/aaax}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}
  data:
    redis:
      host: ${REDIS_URL:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000
      ssl:
        enabled: ${REDIS_SSL:false}
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      properties:
        allow.auto.create.topics: true
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:45000}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/oauth2/jwks}
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}

# =============================================================================
# aaax — this application
# =============================================================================
aaax:
  local-seed: ${AAAX_LOCAL_SEED:false}
  cors:
    allowed-origin-patterns: ${AAAX_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  kafka:
    enabled: ${AAAX_KAFKA_ENABLED:false}
    consumers:
      user-with-user-route-creation-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_ROUTE_CREATION:false}
      log-listener:
        isEnabled: ${KAFKA_CONSUMERS_LOG:false}
      user-alias-generated-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_ALIAS_GENERATED:false}
      user-created-notification-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_CREATED_NOTIFICATION:false}
      user-permission-mutation-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_PERMISSION_MUTATION:false}
      user-state-change-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_STATE_CHANGE:false}
      user-status-change-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_STATUS_CHANGE:false}
      user-login-attempts-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_LOGIN_ATTEMPTS:false}
      user-deleted-notification-listener:
        isEnabled: ${KAFKA_CONSUMERS_USER_DELETED_NOTIFICATION:false}
  pod:
    ip: ${POD_IP:127.0.0.1}
  otp:
    fail-counter: 3
  config:
    credentials-history-size: ${CONFIG_CREDENTIALS_HISTORY_SIZE:0}
    user-created-waiting-time-ms: ${USER_CREATED_WAITING_TIME_MS:1}
    system-invoker: ${SYSTEM_INVOKER:AAAX}
    device-binding:
      # OFF: login does not check devices. TRUST_LATEST only applies to POST /user-devices.
      mode: ${CONFIG_DEVICE_BINDING_MODE:OFF}
    microservice:
      timezone: ${MICROSERVICE_TIME_ZONE:UTC}
    # Protected bootstrap accounts (comma-separated usernames) — never bulk-deleted
    protected-usernames: ${AAAX_PROTECTED_USERNAMES:admin@aaax.local}
  security:
    max-login-attempts: ${AAAX_MAX_LOGIN_ATTEMPTS:5}
    password-patterns:
      - ".{8,}"
    issuer: ${AS_ISSUER:http://localhost:8081}
    registered-client:
      secret: ${REGISTERED_CLIENT_SECRET:secret}
    refresh-token:
      history-count: ${REFRESH_TOKEN_HISTORY_COUNT:10}
    server:
      expiry-time: ${SERVER_TOKEN_EXPIRY_TIME:31556926}
  jwk:
    keystore: ${AAAX_JWK_KEYSTORE:}
    keystore-password: ${AAAX_JWK_KEYSTORE_PASSWORD:}
    keystore-alias: ${AAAX_JWK_KEYSTORE_ALIAS:}
  encryption:
    keystore: ${AAAX_ENCRYPTION_KEYSTORE:}
    keystore-password: ${AAAX_ENCRYPTION_KEYSTORE_PASSWORD:}
    keystore-alias: ${AAAX_ENCRYPTION_KEYSTORE_ALIAS:}
  notification-template:
    usecase:
      reset-password:
        email: ${EMAIL_TEMPLATE_RESET_PASSWORD:}
      register-user:
        email: ${EMAIL_TEMPLATE_REGISTER:}
      otp-register:
        email: ${EMAIL_TEMPLATE:}
  oauth-provider:
    google:
      web-app:
        client-id: ${WEB_APP_GOOGLE_CLIENT_ID:}
        client-secret: ${WEB_APP_GOOGLE_CLIENT_SECRET:}
      ios:
        client-id: ${IOS_GOOGLE_CLIENT_ID:}
      android:
        client-id: ${ANDROID_GOOGLE_CLIENT_ID:}
    apple:
      ios:
        client-id: ${IOS_APPLE_CLIENT_ID:}
      web:
        client-id: ${WEB_APPLE_CLIENT_ID:}

# =============================================================================
# ext — calling outside
# =============================================================================
ext:
  enabled: ${AAAX_EXT_ENABLED:false}
  util-enabled: ${AAAX_UTIL_ENABLED:false}
  api:
    client:
      aaax-svc:
        url: ${AAAX_SVC_URL:http://127.0.0.1:1/}
        client-id: ${AAAX_SVC_CLIENT_ID:server}
        client-secret: ${AAAX_SVC_CLIENT_SECRET:}
      elk:
        webhookId: ${ELK_WEBHOOK_ID:}
        webhookToken: ${ELK_WEBHOOK_TOKEN:}
      discord:
        webhookId: ${DISCORD_WEBHOOK_ID:}
        webhookToken: ${DISCORD_WEBHOOK_TOKEN:}
      util-svc:
        url: ${UTIL_SVC_URL:http://127.0.0.1:1/}
