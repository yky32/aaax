spring:
  application:
    name: ${SPRING_APPLICATION_NAME:aaax-server}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:aaax;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: true
  h2:
    console:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8081}

aaax:
  issuer: ${AAAX_ISSUER:http://localhost:8081}
  jwk:
    path: ${AAAX_JWK_PATH:./data/aaax-jwk.json}
  bootstrap:
    # optional one-time token required when creating first admin via API
    token: ${AAAX_BOOTSTRAP_TOKEN:}
  otp:
    ttl-seconds: ${AAAX_OTP_TTL_SECONDS:300}
    length: ${AAAX_OTP_LENGTH:6}
    channel: ${AAAX_OTP_CHANNEL:console}
    mail:
      from: ${AAAX_OTP_MAIL_FROM:noreply@aaax.local}
      subject: ${AAAX_OTP_MAIL_SUBJECT:Your AAAX code}
  demo:
    seed-client: ${AAAX_DEMO_SEED_CLIENT:true}
    seed-account: ${AAAX_DEMO_SEED_ACCOUNT:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    org.springframework.security: INFO
