spring:
  application:
    name: ${SPRING_APPLICATION_NAME:aaax-server}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:aaax;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      continue-on-error: true
  h2:
    console:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8081}

aaax:
  issuer: ${AAAX_ISSUER:http://localhost:8081}
  jwk:
    path: ${AAAX_JWK_PATH:./data/aaax-jwk.json}
  bootstrap:
    token: ${AAAX_BOOTSTRAP_TOKEN:}
  # single-realm only (no multi-tenant orgs yet)
  orgs:
    model: single
  otp:
    ttl-seconds: ${AAAX_OTP_TTL_SECONDS:300}
    length: ${AAAX_OTP_LENGTH:6}
    # console | mail | kafka | sms
    # kafka = Mode1 event for caller notification-service
    # sms   = Mode2 HTTP webhook to caller-owned SMS/provider
    channel: ${AAAX_OTP_CHANNEL:console}
    mail:
      from: ${AAAX_OTP_MAIL_FROM:noreply@aaax.local}
      subject: ${AAAX_OTP_MAIL_SUBJECT:Your AAAX code}
    kafka:
      bootstrap-servers: ${AAAX_OTP_KAFKA_BOOTSTRAP:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
      topic: ${AAAX_OTP_KAFKA_TOPIC:aaax.otp.dispatch}
    sms:
      webhook-url: ${AAAX_OTP_SMS_WEBHOOK_URL:}
      webhook-auth: ${AAAX_OTP_SMS_WEBHOOK_AUTH:}
  saml:
    # SAML 2 Service Provider (login with external IdP)
    enabled: ${AAAX_SAML_ENABLED:false}
    registration-id: ${AAAX_SAML_REGISTRATION_ID:idp}
    sp-entity-id: ${AAAX_SAML_SP_ENTITY_ID:}
    idp-metadata-uri: ${AAAX_SAML_IDP_METADATA_URI:}
  demo:
    seed-client: ${AAAX_DEMO_SEED_CLIENT:true}
    seed-account: ${AAAX_DEMO_SEED_ACCOUNT:true}
  events:
    # Competitive wedge: fan-out identity lifecycle to platform notification-service
    kafka:
      enabled: ${AAAX_EVENTS_KAFKA_ENABLED:false}
      bootstrap-servers: ${AAAX_EVENTS_KAFKA_BOOTSTRAP:${aaax.otp.kafka.bootstrap-servers:localhost:9092}}
      topic: ${AAAX_EVENTS_KAFKA_TOPIC:aaax.identity.events}
    webhook-url: ${AAAX_EVENTS_WEBHOOK_URL:}
    webhook-auth: ${AAAX_EVENTS_WEBHOOK_AUTH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    org.springframework.security: INFO
