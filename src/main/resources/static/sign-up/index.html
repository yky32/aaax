<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up · AAAX</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="shell">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <div class="logo">AAAX</div>
          <div class="tag">Sign up</div>
        </div>
      </div>
      <div class="card">
        <h1>Create account</h1>
        <p class="lede">Hosted registration — same self-host binary as your OIDC server.</p>
        <form id="form">
          <label class="field">Username <input name="username" required minlength="3" maxlength="64" autocomplete="username" /></label>
          <label class="field">Email <input name="email" type="email" autocomplete="email" /></label>
          <label class="field">Password <input name="password" type="password" required minlength="8" autocomplete="new-password" /></label>
          <button class="btn primary" type="submit">Create account</button>
        </form>
        <p id="msg" class="err"></p>
        <div class="foot">Have an account? <a href="/sign-in/">Sign in</a></div>
      </div>
    </div>
  </div>
  <script type="module">
    const api = (p, o = {}) => fetch(p, { credentials: "include", headers: { "content-type": "application/json" }, ...o });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = {
        username: fd.get("username"),
        email: fd.get("email") || null,
        password: fd.get("password"),
      };
      const r = await api("/v1/accounts/register", { method: "POST", body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        document.getElementById("msg").textContent = j.message || "Sign up failed";
        return;
      }
      // auto sign-in
      const login = await api("/v1/auth/login", {
        method: "POST",
        body: JSON.stringify({ username: body.username, password: body.password }),
      });
      if (login.ok) location.href = "/user/";
      else location.href = "/sign-in/";
    });
  </script>
</body>
</html>
