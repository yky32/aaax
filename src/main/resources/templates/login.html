<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in — AAAX</title>
  <link rel="stylesheet" th:href="@{/css/aaax-hosted.css}"/>
</head>
<body>
<main class="card">
  <p class="brand">AAAX</p>
  <p class="tagline">Accounts · Authentication · Authorization · eXperiences</p>
  <h1>Sign in</h1>
  <p class="lead">Continue OAuth2 authorization or use your AAAX account.</p>

  <div th:if="${param.error}" class="alert alert-error" role="alert">
    Invalid username or password.
  </div>
  <div th:if="${param.logout}" class="alert alert-info" role="status">
    You have been signed out.
  </div>

  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus/>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required/>
    <button type="submit">Sign in</button>
  </form>

  <p class="foot">
    Hosted browser login for <code>/oauth2/authorize</code>.
    Machine clients: <a href="https://github.com/yky32/aaax/blob/main/README.md#oauth-20-as">POST /oauth2/token</a>.
  </p>
</main>
</body>
</html>
