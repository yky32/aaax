# Test profile — local/testcontainers only. Same three roots as main.
# spring (Boot native) · aaax (this app) · ext (outbound)

# =============================================================================
# spring — Spring Boot native
# =============================================================================
spring:
  application:
    name: ${APPLICATION_NAME:AAAX-TEST}
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:13.2:///?TC_INITSCRIPT=ddl.sql
    password: ${DB_PASSWORD:}
    username: ${DB_USERNAME:aaax}
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    show-sql: true
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yaml
    enabled: false
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_URL:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000
      ssl:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${jwkSetUri:http://localhost:8081/oauth2/jwks}

# =============================================================================
# aaax — this application
# =============================================================================
aaax:
  local-seed: false
  kafka:
    enabled: false
  pod:
    ip: ${POD_IP:127.0.0.1}
  otp:
    fail-counter: 3
  config:
    credentials-history-size: 0
    system-invoker: ${SYSTEM_INVOKER:AAAX}
    device-binding:
      mode: ${CONFIG_DEVICE_BINDING_MODE:OFF}
    protected-usernames: admin@aaax.local,ios-tester@aaax.local
  security:
    max-login-attempts: 5
    password-patterns:
      - ".{8,}"
    issuer: ${AS_ISSUER:http://localhost:8081}
    registered-client:
      secret: ${REGISTERED_CLIENT_SECRET:secret}
    refresh-token:
      history-count: ${REFRESH_TOKEN_HISTORY_COUNT:10}
    server:
      expiry-time: ${REFRESH_TOKEN_EXPIRY_TIME:31556926}
  notification-template:
    usecase:
      reset-password:
        email: test-reset
      register-user:
        email: test-register
      otp-register:
        email: test-otp
  oauth-provider:
    google:
      web-app:
        client-id: ${WEB_APP_GOOGLE_CLIENT_ID:}
        client-secret: ${WEB_APP_GOOGLE_CLIENT_SECRET:}
      ios:
        client-id: ${IOS_GOOGLE_CLIENT_ID:}
      android:
        client-id: ${ANDROID_GOOGLE_CLIENT_ID:}
    apple:
      ios:
        client-id: ${IOS_APPLE_CLIENT_ID:}
      web:
        client-id: ${WEB_APPLE_CLIENT_ID:}

# =============================================================================
# ext — calling outside
# =============================================================================
ext:
  enabled: false
  util-enabled: false
  api:
    client:
      aaax-svc:
        url: ${AAAX_SVC_URL:http://127.0.0.1:1/}
        client-id: ${AAAX_SVC_CLIENT_ID:server}
        client-secret: ${AAAX_SVC_CLIENT_SECRET:}
      elk:
        webhookId: ${ELK_WEBHOOK_ID:}
        webhookToken: ${ELK_WEBHOOK_TOKEN:}
      discord:
        webhookId: ${DISCORD_WEBHOOK_ID:}
        webhookToken: ${DISCORD_WEBHOOK_TOKEN:}
      util-svc:
        url: ${UTIL_SVC_URL:http://127.0.0.1:1/}
  webhook:
    aaax:
      domain: ${AAAX_WEBHOOK:}
